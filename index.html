<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio YouTube</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #020617; color: #f8fafc; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .bar { transition: height 0.2s ease; }
        #player { display: none; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">

    <div class="glass p-10 rounded-[2.5rem] w-80 text-center shadow-2xl">
        <div id="visualizer" class="flex justify-center items-end space-x-1.5 h-16 mb-8">
            <div class="bar bg-cyan-500 w-2 h-4 rounded-full"></div>
            <div class="bar bg-blue-500 w-2 h-8 rounded-full"></div>
            <div class="bar bg-indigo-500 w-2 h-12 rounded-full"></div>
            <div class="bar bg-purple-500 w-2 h-6 rounded-full"></div>
            <div class="bar bg-pink-500 w-2 h-10 rounded-full"></div>
        </div>

        <div class="mb-8">
            <h1 class="text-xs font-black tracking-[0.2em] text-blue-400 uppercase mb-2">Now Playing</h1>
            <div class="h-12 flex items-center justify-center">
                <p id="track-title" class="text-lg font-medium leading-tight px-2 italic text-gray-200">Loading Station...</p>
            </div>
        </div>

        <div id="player"></div>

        <div class="space-y-6">
            <div class="flex items-center justify-between px-4">
                <button onclick="playPrev()" class="text-gray-400 hover:text-white transition">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18V6h2v12H6zm3.5-6L18 18V6l-8.5 6z"/></svg>
                </button>
                
                <button onclick="togglePlay()" id="play-btn" class="bg-white text-black p-5 rounded-full hover:scale-105 transition shadow-lg">
                    <svg id="play-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                </button>

                <button onclick="playNext()" class="text-gray-400 hover:text-white transition">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                </button>
            </div>
            
            <div class="px-4">
                <input type="range" min="0" max="100" value="50" oninput="changeVolume(this.value)" class="w-full h-1 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-blue-500">
            </div>
        </div>

        <p class="mt-8 text-[10px] text-gray-500 uppercase tracking-widest font-bold">GitHub Radio Engine v1.0</p>
    </div>

    <script>
        var player;
        var stations = [];
        var currentIndex = 0;
        var isPlaying = false;
        var vizInterval;

        // Fetch stations and then start
        fetch('/stations.json')
            .then(res => res.json())
            .then(data => {
                stations = data.map(url => extractId(url)).filter(id => id);
                initYT();
            });

        function extractId(url) {
            const match = url.match(/(?:youtu\.be\/|youtube\.com(?:\/embed\/|\/v\/|\/watch\?v=|\/user\/\S+|\/ytscreeningroom\?v=))([\w\-]{11})/);
            return (match && match[1]) ? match[1] : null;
        }

        function initYT() {
            var tag = document.createElement('script');
            tag.src = "https://www.youtube.com/iframe_api";
            document.head.appendChild(tag);
        }

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '0', width: '0',
                videoId: stations[currentIndex],
                events: {
                    'onStateChange': onPlayerStateChange,
                    'onError': () => playNext() // Skip broken links
                }
            });
        }

        function onPlayerStateChange(event) {
            if (event.data == YT.PlayerState.PLAYING) {
                document.getElementById('track-title').innerText = player.getVideoData().title;
                setPlayState(true);
            } else if (event.data == YT.PlayerState.ENDED) {
                playNext();
            } else {
                setPlayState(false);
            }
        }

        function setPlayState(playing) {
            isPlaying = playing;
            const btn = document.getElementById('play-icon');
            if (playing) {
                btn.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
                startViz();
            } else {
                btn.innerHTML = '<path d="M8 5v14l11-7z"/>';
                stopViz();
            }
        }

        function togglePlay() {
            if (isPlaying) player.pauseVideo();
            else player.playVideo();
        }

        function playNext() {
            currentIndex = (currentIndex + 1) % stations.length;
            player.loadVideoById(stations[currentIndex]);
        }

        function playPrev() {
            currentIndex = (currentIndex - 1 + stations.length) % stations.length;
            player.loadVideoById(stations[currentIndex]);
        }

        function changeVolume(v) { player.setVolume(v); }

        function startViz() {
            vizInterval = setInterval(() => {
                document.querySelectorAll('.bar').forEach(bar => {
                    bar.style.height = Math.floor(Math.random() * 50 + 10) + 'px';
                });
            }, 150);
        }

        function stopViz() {
            clearInterval(vizInterval);
            document.querySelectorAll('.bar').forEach(bar => bar.style.height = '10px');
        }
    </script>
</body>
</html>
